[package]
name = "classnote"
version = "0.1.0"
description = "Agenda escolar offline para docentes de primaria"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "classnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
